<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประเพณียี่เป็ง · งานผลิตยา ฝ่ายเภสัชกรรม</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff;box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#0b1030;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--ink)}
#sky{position:absolute;inset:0;background:linear-gradient(#070a22,#1b1f5a 55%,#3a3a86)}
#dusk{position:absolute;inset:0;background:linear-gradient(#0c1a4c 0%,#21418f 40%,#7a5590 58%,#d9774a 70%,#ffb062 82%,#ffd08a 100%);opacity:0;animation:dusk 70s ease-in-out infinite alternate}@keyframes dusk{0%,12%{opacity:0}88%,100%{opacity:1}}
.scn{position:absolute;left:0;width:100%;overflow:hidden;pointer-events:none;z-index:1}.scn{display:block}.scn.far{bottom:20.4%;height:22vh;height:22svh;opacity:.92}.scn.near{bottom:19.6%;height:27vh;height:27svh}
.scn .tr{display:flex;height:100%;width:max-content;animation:slide2 linear infinite;will-change:transform;backface-visibility:hidden}.scn.far .tr{animation-duration:240s}.scn.near .tr{animation-duration:190s}@keyframes slide2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.scn img{height:100%;width:auto;flex:none;display:block;user-select:none;-webkit-user-drag:none}.scn img.fl{transform:scaleX(-1)}
.scn .tw{animation:tw 2.2s ease-in-out infinite}.win{animation:win 5s ease-in-out infinite alternate}@keyframes win{to{opacity:.5}}
.spk{transform-box:fill-box;transform-origin:center;animation:spk .4s linear infinite}@keyframes spk{50%{transform:rotate(45deg) scale(1.4);opacity:.55}}
.hb{animation:hb 2.4s ease-in-out infinite}@keyframes hb{50%{transform:translateY(-7px)}}
#bigfw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fishc{position:absolute;left:0;bottom:0;width:100%;height:40%;pointer-events:none}
#drones{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.ln{position:absolute;bottom:-60px;width:34px;height:44px;border-radius:10px 10px 6px 6px;background:linear-gradient(#ffd23f,#f5a300);box-shadow:0 0 22px 8px rgba(255,190,50,.55);animation:rise linear infinite}
@keyframes rise{to{transform:translate(30px,calc(-100vh - 340px))}}
.fw{position:absolute;width:6px;height:6px}
.fw i{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y));opacity:0}}
.w{position:absolute;left:0;bottom:0;width:100%;overflow:hidden;pointer-events:none}
.w svg{width:200%;height:100%;display:block;animation:slide linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.k{position:absolute;left:0;animation:drift linear infinite;will-change:transform;cursor:pointer}@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(110vw)}}
.b{position:relative;animation:bob ease-in-out infinite;transform-origin:50% 92%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.b img{width:100%;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.g{position:absolute;left:28%;top:2%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(255,200,80,.85),rgba(255,140,0,0) 70%);mix-blend-mode:screen;animation:fl .9s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{from{opacity:.4;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
.cap{position:absolute;left:50%;transform:translateX(-50%);top:100%;white-space:nowrap;font-size:12px;background:rgba(0,0,0,.35);padding:1px 8px;border-radius:9px;margin-top:2px}
h1{position:absolute;z-index:20;top:0;left:0;right:0;margin:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;text-align:center;font-size:clamp(20px,4vw,34px);text-shadow:0 2px 10px #000;pointer-events:none}
#cnt{font-size:clamp(13px,2vw,16px);font-weight:400;opacity:.92;margin-top:2px;min-height:1.2em}
#add{position:absolute;z-index:30;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);text-align:right}
button,input{font:inherit}
.btn{background:#ffb703;color:#222;border:0;border-radius:22px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}
#adm{display:none;background:#e63946;color:#fff;margin-right:6px}body.admin #adm{display:inline-block}
#panel{display:none;text-align:left;margin-top:8px;margin-left:auto;background:rgba(10,14,50,.95);padding:12px;border-radius:14px;width:min(280px,calc(100vw - 28px));max-height:calc(100vh - 90px);overflow:auto;box-sizing:border-box;box-shadow:0 4px 20px #000}
#panel.on{display:block}#panel input{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:6px;border-radius:8px;border:1px solid #567;background:#fff;color:#111}
#panel small{opacity:.85}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:10px;padding:7px 4px;background:#2a3170;color:#fff;cursor:pointer}.tabs button.on{background:#ffb703;color:#222;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.pick button{aspect-ratio:1;border:2px solid transparent;border-radius:10px;background:rgba(255,255,255,.08);padding:3px;cursor:pointer;color:#fff;font-size:11px;line-height:1.25}
.pick button.on{border-color:#ffb703;background:rgba(255,183,3,.2)}
.pick img{width:100%;height:100%;object-fit:contain;display:block}
#upbox{display:none}#upbox.on{display:block}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:min(240px,60vw);background:rgba(255,248,220,.96);color:#2a1a00;padding:6px 10px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:50;text-align:center}.bub.on{opacity:1}
.moon{position:absolute;left:5%;top:calc(env(safe-area-inset-top,0px) + 60px);width:clamp(110px,20vw,260px);aspect-ratio:1;filter:drop-shadow(0 0 28px rgba(255,240,150,.75));animation:pl 6s ease-in-out infinite alternate}.moon img{width:100%;height:100%;display:block;}@keyframes pl{to{filter:drop-shadow(0 0 48px rgba(255,240,150,.95))}}.hl{position:absolute;top:0;z-index:10;width:clamp(46px,7vw,100px);transform-origin:50% 0;animation:sw 5s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px rgba(255,200,90,.55));pointer-events:none}.hl i{display:block;width:1px;height:36px;background:rgba(255,255,255,.5);margin:0 auto}.hl img{width:100%;display:block}@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media(max-width:600px){h1{text-align:left;font-size:16px;padding-right:150px}body.admin h1{padding-right:190px}#adm{padding:8px 11px}#adm span{display:none}}
.ln2{position:absolute;bottom:-170px;width:clamp(64px,10vw,120px);animation:rise linear infinite;filter:drop-shadow(0 0 18px rgba(255,190,80,.65))}.ln2 img{width:100%;display:block}
.ln3{position:absolute;bottom:-300px;width:clamp(70px,11vw,130px);animation:rise linear infinite;filter:drop-shadow(0 0 18px rgba(255,190,80,.6))}.ln3 img{width:100%;display:block}.ln3 .p{transform-origin:50% 0;animation:tagsw 3.4s ease-in-out infinite alternate}@keyframes tagsw{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.ul{position:absolute;bottom:-230px;z-index:1;width:clamp(58px,8.5vw,104px);animation:rise linear infinite;cursor:pointer}
.ul .sw{position:relative;transform-origin:50% 0;animation:sw ease-in-out infinite alternate}
.ul img{width:100%;display:block;filter:drop-shadow(0 0 16px rgba(255,180,70,.75))}
.ul .bub{bottom:auto;top:100%;margin-top:24px}
#snd{position:fixed;z-index:40;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(10,14,50,.55);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#mgr{position:fixed;inset:0;z-index:60;background:rgba(5,8,30,.96);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
#mgr.on{display:block}
#mgr .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}#mgr .hd b{flex-basis:100%;font-size:18px}#mgr .hd .btn{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
.row .th{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:0;border-radius:8px;font-size:20px;color:#fff;cursor:pointer;padding:2px}.row .th img{max-width:100%;max-height:100%}
.row .tx{flex:1;min-width:0;font-size:13px;word-break:break-word}.row .tx b{display:block}.row .tx span{opacity:.7;font-size:12px}
.del{background:#e63946;color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;flex:none}
</style></head><body>
<div id="sky"><div id="dusk"></div></div>
<h1>🏮 ประเพณียี่เป็ง งานผลิตยา 🪷<div id="cnt"></div></h1>
<div id="add"><button class="btn" id="adm">🛠<span> จัดการ</span></button><button class="btn" id="tg">＋ ร่วมกิจกรรม</button>
<div id="panel">
<div class="tabs"><button data-k="krathong" class="on">🪷 ลอยกระทง</button><button data-k="lantern">🏮 ปล่อยโคม</button></div>
<small id="pkl">วาดเองแล้วอัปรูป หรือเลือกแบบสำเร็จรูป</small><div class="pick" id="pick"></div>
<div id="upbox"><small id="uph">รูปกระทงของคุณ (วางบนพื้นเรียบสีเดียว)</small><input id="fi" type="file" accept="image/*"></div>
<small>ชื่อของคุณ</small><input id="nm" maxlength="24"><small>คำอธิษฐาน</small><input id="pr" maxlength="90" placeholder="เช่น ขอให้ทุกคนมีความสุข">
<div id="ms" style="font-size:12px;min-height:16px;margin-bottom:6px;color:#ffd"></div><button class="btn" id="go">ลอยกระทง 🪷</button></div></div>
<button id="snd" type="button" aria-label="เปิด/ปิดเสียง">🔇</button>
<div id="mgr"><div class="hd"><b>🛠 จัดการกระทง / โคม</b><button class="btn" id="mrf">รีเฟรช</button><button class="btn" id="mout" style="background:#555;color:#fff">ออกจากโหมดแอดมิน</button><button class="btn" id="mcl">ปิด</button></div><div class="sky"><b style="font-size:15px">✨ ข้อความบนท้องฟ้า (โดรน)</b><div style="display:flex;gap:6px;margin:8px 0"><input id="skyin" maxlength="40" placeholder="ขึ้นบรรทัดใหม่ใช้ | เช่น สุขสันต์|วันลอยกระทง" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid #567;font:inherit"><button class="btn" id="skyadd" type="button">เพิ่ม</button></div><div id="skyls"></div></div><b style="display:block;font-size:15px;margin:16px 0 4px">🪷 กระทง / 🏮 โคม</b><div id="mls"></div></div>

const $=(s)=>document.querySelector(s),sky=$('#sky'),rnd=(a,b)=>a+Math.random()*(b-a);
/* ---------- sound: soft background music + gentle synthesized effects (starts after the first tap) ---------- */
const sfx={ctx:null,on:false,master:null,music:null,noise:null,
  muted:(()=>{try{return localStorage.getItem('lk_mute')==='1'}catch(e){return false}})()};
function sfxInit(){if(sfx.ctx)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=sfx.ctx=new A();
  sfx.master=c.createGain();sfx.master.gain.value=.9;sfx.master.connect(c.destination);
  const n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;sfx.noise=n;
  const au=new Audio('bg/music.mp3');au.loop=true;au.preload='auto';au.crossOrigin='anonymous';sfx.au=au;
  try{const src=c.createMediaElementSource(au),g=c.createGain();g.gain.value=.13;src.connect(g);g.connect(sfx.master);sfx.music=g}catch(e){au.volume=.13}}
function sfxSet(on){sfx.on=on;try{localStorage.setItem('lk_mute',on?'0':'1')}catch(e){}$('#snd').textContent=on?'🔊':'🔇';
  if(on){sfxInit();if(!sfx.ctx)return;sfx.ctx.resume();sfx.au.play().catch(()=>{})}else if(sfx.ctx){sfx.au.pause();sfx.ctx.suspend()}}
function live(){return sfx.on&&sfx.ctx&&sfx.ctx.state==='running'&&!document.hidden}
function nz(t,dur,type,freq,q,vol,out){const c=sfx.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=sfx.noise;f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(out||sfx.master);s.start(t,Math.random());s.stop(t+dur+.05)}
function tone(t,dur,f0,f1,vol,type='sine'){const c=sfx.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(sfx.master);o.start(t);o.stop(t+dur+.05)}
sfx.pop=()=>{if(!live())return;const t=sfx.ctx.currentTime+rnd(0,.05),v=rnd(.025,.05);nz(t,.35,'lowpass',rnd(700,1300),.7,v);for(let i=0;i<5;i++)nz(t+.12+i*rnd(.03,.07),.03,'highpass',3000,.5,v*.5)};
sfx.whistle=()=>{if(!live())return;const t=sfx.ctx.currentTime;tone(t,1.2,500,1600,.018,'sine');nz(t,1.2,'bandpass',2500,6,.02)};
sfx.boom=()=>{if(!live())return;const t=sfx.ctx.currentTime;nz(t,1.6,'lowpass',260,.8,.32);tone(t,.9,90,40,.22);nz(t,.5,'bandpass',900,1,.08)};
sfx.crackle=()=>{if(!live())return;const t=sfx.ctx.currentTime;for(let i=0;i<26;i++)nz(t+rnd(0,1.1),.025,'highpass',rnd(2500,5000),.7,rnd(.015,.04))};
sfx.splash=big=>{if(!live())return;const t=sfx.ctx.currentTime;nz(t,big?.22:.14,'bandpass',big?850:1300,1.2,big?.05:.03);tone(t,.09,big?600:900,big?260:420,big?.035:.02)};

  const c=document.createElement('canvas');c.className='scn '+o.cls;document.body.appendChild(c);
  const ly={...o,c,ctx:c.getContext('2d'),im:new Image(),tile:null,off:0};layers.push(ly);ly.im.onload=()=>size(ly);ly.im.src=o.src});
function size(ly){const im=ly.im;if(!im.naturalWidth)return;const dpr=Math.min(devicePixelRatio||1,2),r=ly.c.getBoundingClientRect();
  ly.c.width=Math.max(1,Math.round(r.width*dpr));ly.c.height=Math.max(1,Math.round(r.height*dpr));
  const h=ly.c.height,w=Math.round(im.naturalWidth*h/im.naturalHeight),t=document.createElement('canvas');t.width=ly.mirror?w*2:w;t.height=h;
  const g=t.getContext('2d');g.drawImage(im,0,0,w,h);if(ly.mirror){g.translate(w*2,0);g.scale(-1,1);g.drawImage(im,0,0,w,h)}
  const old=ly.tile;ly.tile=t;ly.speed=t.width/ly.dur;if(old)ly.off=ly.off/old.width*t.width}
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  for(const ly of layers){if(!ly.tile)continue;const {ctx,c,tile}=ly;ly.off=(ly.off+ly.speed*dt)%tile.width;ctx.clearRect(0,0,c.width,c.height);for(let x=-ly.off;x<c.width;x+=tile.width)ctx.drawImage(tile,x,0)}
  requestAnimationFrame(frame)}

const FISH_T=[
 {body:'#ff8a1f',belly:'#ffd9a8',tail:'#ff6a00',fin:'#ff9d45',h:.24,marks:()=>{}},                                                   // goldfish

 {body:'#c9d6e3',tail:'#8fa3b8',fin:'#8fa3b8',h:.22,marks:(c,L,h)=>{c.fillStyle='#34495e';for(const x of [-.22,-.06,.1])c.fillRect(L*x,-h,L*.05,h*2)}}, // striped barb

function drawFish(c,f,L,wag){const h=L*f.h,tl=f.big?.8:.62;
  c.fillStyle=f.tail;c.beginPath();c.moveTo(-L*.36,0);c.lineTo(-L*tl,-h*(f.big?1.7:1.05)+wag*h*.7);c.quadraticCurveTo(-L*(tl-.08),wag*h*.4,-L*tl,h*(f.big?1.7:1.05)+wag*h*.7);c.closePath();c.fill();
  c.fillStyle=f.fin;c.beginPath();c.moveTo(-L*.14,-h*.8);c.quadraticCurveTo(L*.0,-h*1.65,L*.14,-h*.82);c.closePath();c.fill();
  c.fillStyle=f.body;c.beginPath();c.ellipse(0,0,L*.42,h,0,0,6.3);c.fill();
  c.save();c.clip();if(f.belly){c.fillStyle=f.belly;c.beginPath();c.ellipse(L*.03,h*.6,L*.34,h*.5,0,0,6.3);c.fill()}f.marks(c,L,h);c.restore();
  c.fillStyle='#fff';c.beginPath();c.arc(L*.25,-h*.2,h*.3,0,6.3);c.fill();c.fillStyle='#14161c';c.beginPath();c.arc(L*.27,-h*.2,h*.16,0,6.3);c.fill()}
const fishLayers=[];
function fishLayer(z,dmin,dmax,surf,n){const c=document.createElement('canvas');c.className='fishc';c.style.zIndex=z;document.body.insertBefore(c,document.querySelector('.k'));   /* below every krathong */
  const ly={c,ctx:c.getContext('2d'),dmin,dmax,surf,fish:[],fx:[],W:0,H:0,cH:0,dpr:1};
  ly.size=()=>{ly.dpr=Math.min(devicePixelRatio||1,2);ly.W=innerWidth;ly.H=innerHeight;ly.cH=Math.round(ly.H*.4);c.width=ly.W*ly.dpr;c.height=ly.cH*ly.dpr;ly.fish.forEach(f=>f.depth=ly.y(rnd(dmin,dmax)))};
  ly.y=p=>ly.cH-p/100*ly.H;ly.size();
  for(let i=0;i<n;i++){const t=FISH_T[(i*5+z)%FISH_T.length],L=Math.max(22,Math.min(46,ly.W*.06))*rnd(.75,1.1),dir=Math.random()<.5?1:-1;
    ly.fish.push({t,L,dir,x:rnd(0,ly.W),depth:ly.y(rnd(dmin,dmax)),sp:rnd(18,42),ph:rnd(0,6.3),st:'swim',wait:rnd(3,20),vx:0,vy:0,y:0})}
  ly.fish.forEach(f=>f.y=f.depth);fishLayers.push(ly);return ly}
function splash(ly,x,y,big){y-=3;sfx.splash(big);ly.fx.push({k:'ring',x,y,age:0,life:.9,s:big?1.3:1});for(let i=0;i<(big?10:6);i++)ly.fx.push({k:'drop',x,y,vx:rnd(-70,70),vy:-rnd(90,200),age:0,life:.7})}
let fLast=performance.now();
function fishFrame(now){const dt=Math.min(.05,(now-fLast)/1000);fLast=now;
  for(const ly of fishLayers){const {ctx:c,dpr,W}=ly,sY=ly.y(ly.surf),g=900;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,ly.cH);
    for(const f of ly.fish){f.ph+=dt*(f.st==='jump'?14:7);
      if(f.st==='swim'){f.x+=f.dir*f.sp*dt;f.y=f.depth+Math.sin(f.ph*.35)*3;f.ang=Math.sin(f.ph*.3)*.08;
        if(f.x>W+50)f.x=-50;else if(f.x<-50)f.x=W+50;
        if((f.wait-=dt)<=0&&f.x>40&&f.x<W-40){const up=f.depth-sY+ly.H*rnd(.04,.085);f.st='jump';f.vy=-Math.sqrt(2*g*up);f.vx=f.dir*f.sp*rnd(2,3);f.out=0}}
      else{const py=f.y;f.vy+=g*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.ang=Math.atan2(f.vy,Math.abs(f.vx))*.9;
        if(!f.out&&py>sY&&f.y<=sY){f.out=1;splash(ly,f.x,sY,0)}
        if(f.out&&py<sY&&f.y>=sY){f.out=2;splash(ly,f.x,sY,1)}
        if(f.vy>0&&f.y>=f.depth){f.st='swim';f.y=f.depth;f.wait=rnd(8,24);if(Math.random()<.3)f.dir*=-1}}
      if(f.st!=='jump'||f.y-f.L*.5>sY)continue;   /* swimming fish stay hidden under the wave; only the part above the surface shows */
      c.save();c.beginPath();c.rect(0,0,W,sY);c.clip();c.translate(f.x,f.y);c.scale(f.dir,1);c.rotate(f.ang);drawFish(c,f.t,f.L,Math.sin(f.ph));c.restore()}
    for(let i=ly.fx.length-1;i>=0;i--){const e=ly.fx[i];e.age+=dt;if(e.age>=e.life){ly.fx.splice(i,1);continue}const a=1-e.age/e.life;
      if(e.k==='ring'){c.strokeStyle=`rgba(255,255,255,${a*.8})`;c.lineWidth=1.6;c.beginPath();c.ellipse(e.x,e.y,(8+e.age*40)*e.s,(2.5+e.age*8)*e.s,0,0,6.3);c.stroke();
        c.beginPath();c.ellipse(e.x,e.y,(3+e.age*22)*e.s,(1+e.age*4)*e.s,0,0,6.3);c.stroke()}
      else{e.vy+=g*.8*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;c.fillStyle=`rgba(230,248,255,${a})`;c.beginPath();c.arc(e.x,e.y,1.8,0,6.3);c.fill()}}
    c.globalAlpha=1}
  requestAnimationFrame(fishFrame)}

function clean(img,mx){const s=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
const D=x.getImageData(0,0,c.width,c.height),p=D.data,W=c.width,H=c.height,N=W*H;
/* background colour = median of the (non-transparent) border pixels, so any plain colour works */
const edge=[];for(let i=0;i<W;i++)edge.push(i,(H-1)*W+i);for(let j=1;j<H-1;j++)edge.push(j*W,j*W+W-1);
const op=edge.filter(i=>p[i*4+3]>30),med=k=>{const a=op.map(i=>p[i*4+k]).sort((u,v)=>u-v);return a.length?a[a.length>>1]:255},bg=[med(0),med(1),med(2)];
const dist=(i,r,g,b)=>Math.abs(p[i*4]-r)+Math.abs(p[i*4+1]-g)+Math.abs(p[i*4+2]-b);
const FAR=150,STEP=36,seen=new Uint8Array(N),st=[];
/* flood-fill from the border: a pixel is background if it is transparent, or close to the background colour and to the neighbour it was reached from (handles shadows/uneven light) */
const isBg=(i,f)=>p[i*4+3]<=30||(dist(i,bg[0],bg[1],bg[2])<FAR&&(f<0||dist(i,p[f*4],p[f*4+1],p[f*4+2])<STEP));
edge.forEach(i=>st.push(i,-1));
while(st.length){const f=st.pop(),i=st.pop();if(seen[i]||!isBg(i,f))continue;seen[i]=1;const x0=i%W;if(x0>0)st.push(i-1,i);if(x0<W-1)st.push(i+1,i);if(i>=W)st.push(i-W,i);if(i<N-W)st.push(i+W,i)}
for(let i=0;i<N;i++)if(seen[i])p[i*4+3]=0;
/* soften the cut edge by one pixel */
for(let i=0;i<N;i++){if(seen[i])continue;const x0=i%W;if((x0>0&&seen[i-1])||(x0<W-1&&seen[i+1])||(i>=W&&seen[i-W])||(i<N-W&&seen[i+W]))p[i*4+3]=Math.min(p[i*4+3],170)}
x.putImageData(D,0,0);let x1=W,y1=H,x2=-1,y2=-1;for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(p[(j*W+i)*4+3]>40){if(i<x1)x1=i;if(i>x2)x2=i;if(j<y1)y1=j;if(j>y2)y2=j}
if(x2<0)return c.toDataURL('image/webp',.85);const o=document.createElement('canvas');o.width=x2-x1+1;o.height=y2-y1+1;o.getContext('2d').drawImage(c,x1,y1,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/webp',.85)}
function readImg(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>ok(im);im.src=r.result};r.readAsDataURL(f)})}
